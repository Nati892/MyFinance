version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: app_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: app_db
      MYSQL_USER: user
      MYSQL_PASSWORD: 12345678
    volumes:
      - /my_volumes/hously/db:/var/lib/mysql
    ports:
      - "1122:3306"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_backend
    environment:
      ENV: production
      DB_HOST: db
      DB_NAME: app_db
      DB_USER: user
      DB_PASSWORD: 12345678
      DB_PORT: 3306
      PORT: 1234
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 1h
      BCRYPT_SALT_ROUNDS: 10
    restart: always
    ports:
      - "127.0.0.1:1235:1234"
    volumes:
      - /my_volumes/hously/apk:/app/public/apk
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

volumes:
  db_data:
networks:
  app_network:
    driver: bridge
