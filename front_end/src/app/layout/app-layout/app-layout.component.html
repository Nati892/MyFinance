<div class="app-shell">
  <!-- Fixed header -->
  <header class="app-header">
    <span class="header-brand">Household</span>

    <div class="header-household" [class.has-dropdown]="hasMultipleHouseholds" (click)="hasMultipleHouseholds && toggleDropdown()">
      <span class="household-name">{{ selectedHousehold?.householdName || '...' }}</span>
      <i *ngIf="hasMultipleHouseholds" class="fa fa-chevron-down dropdown-arrow" [class.open]="showHouseholdDropdown"></i>

      <div class="household-dropdown" *ngIf="showHouseholdDropdown && hasMultipleHouseholds">
        <button
          *ngFor="let h of currentUser?.households"
          class="dropdown-item"
          [class.active]="h.householdId === selectedHousehold?.householdId"
          (click)="selectHousehold(h)"
        >
          {{ h.householdName }}
          <span class="role-badge">{{ h.role }}</span>
        </button>
      </div>
    </div>

    <div class="header-user">
      <span class="header-username">{{ currentUser?.username }}</span>
      <button class="header-lang-toggle" (click)="toggleLang()" [title]="currentLang === 'en' ? 'Switch to Hebrew' : 'Switch to English'">
        {{ currentLang === 'en' ? 'EN' : 'HE' }}
      </button>
      <button class="header-signout" (click)="signOut()" [title]="'HEADER.SIGN_OUT' | translate">
        <i class="fa fa-sign-out"></i>
      </button>
    </div>
  </header>

  <!-- Scrollable main content -->
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Fixed bottom navigation -->
  <nav class="app-bottom-nav">
    <a routerLink="/app/expenses" routerLinkActive="active" class="nav-tab">
      <span class="nav-icon">💸</span>
      <span class="nav-label">{{ 'NAV.EXPENSES' | translate }}</span>
    </a>
    <a routerLink="/app/incomes" routerLinkActive="active" class="nav-tab">
      <span class="nav-icon">💰</span>
      <span class="nav-label">{{ 'NAV.INCOMES' | translate }}</span>
    </a>
    <a routerLink="/app/budget" routerLinkActive="active" class="nav-tab">
      <span class="nav-icon">📊</span>
      <span class="nav-label">{{ 'NAV.BUDGET' | translate }}</span>
    </a>
    <a routerLink="/app/assets" routerLinkActive="active" class="nav-tab">
      <span class="nav-icon">🏦</span>
      <span class="nav-label">{{ 'NAV.ASSETS' | translate }}</span>
    </a>
    <a routerLink="/app/home" routerLinkActive="active" class="nav-tab">
      <span class="nav-icon">📌</span>
      <span class="nav-label">{{ 'NAV.BOARD' | translate }}</span>
    </a>
  </nav>
</div>
