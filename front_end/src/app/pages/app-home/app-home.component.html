<div class="board-container">

  <!-- Loading -->
  <div *ngIf="loading" class="board-loading">
    <span class="material-symbols-outlined spin">progress_activity</span>
  </div>

  <!-- Board -->
  <div #board class="board" *ngIf="!loading">

    <!-- Notes -->
    <div
      *ngFor="let note of notes; trackBy: trackNote"
      class="sticky-note"
      [style.left.px]="note.posX"
      [style.top.px]="note.posY"
      [style.z-index]="note.zIndex"
      [style.background]="getNoteColor(note)"
      (mousedown)="startDrag(note, $event)"
      (touchstart)="startDrag(note, $event)"
    >
      <!-- Drag handle / header -->
      <div class="note-header">
        <span class="note-author">{{ note.AppUser?.username || '' }}</span>
        <button class="note-delete" (click)="deleteNote(note, $event)" title="Delete">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Content -->
      <textarea
        class="note-content"
        [value]="note.content"
        placeholder="Write something..."
        (mousedown)="$event.stopPropagation()"
        (touchstart)="$event.stopPropagation()"
        (change)="onNoteContentChange(note, $any($event.target).value)"
      ></textarea>
    </div>

  </div>

  <!-- Floating add button -->
  <button class="fab-add" (click)="addNote()" title="Add note" aria-label="Add note">
    <span class="material-symbols-outlined">add</span>
  </button>

</div>
