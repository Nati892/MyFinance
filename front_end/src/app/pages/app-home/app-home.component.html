<div class="board-container">

  <!-- Loading -->
  <div *ngIf="loading" class="board-loading">
    <span class="material-symbols-outlined spin">progress_activity</span>
  </div>

  <!-- Board -->
  <div #board class="board" *ngIf="!loading" [style.height.px]="getBoardHeight()">

    <!-- Notes -->
    <div
      *ngFor="let note of notes; trackBy: trackNote"
      class="sticky-note"
      [style.left.px]="getNoteLeft(note)"
      [style.top.px]="note.posY"
      [style.z-index]="note.zIndex"
      [style.background]="note.noteColor"
      (mousedown)="startDrag(note, $event)"
      (touchstart)="startDrag(note, $event)"
    >
      <!-- Note header (drag zone) -->
      <div class="note-header" [style.background]="note.headerColor">
        <span class="note-author">{{ note.AppUser?.username || '' }}</span>
        <div class="note-header-actions">
          <!-- 3-dot options button -->
          <button
            class="note-options-btn"
            (click)="toggleMenu(note, $event)"
            title="Options"
          >⋮</button>
          <!-- Delete button -->
          <button class="note-delete" (click)="deleteNote(note, $event)" title="Delete">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </div>

      <!-- Content textarea -->
      <textarea
        #noteTextarea
        class="note-content"
        [attr.data-note-id]="note.id"
        [value]="note.content"
        placeholder="Write something..."
        [style.font-size.px]="note.textSize"
        [style.color]="note.textColor"
        [style.-webkit-text-fill-color]="note.textColor"
        [style.direction]="getTextDirection(note)"
        [class.bold]="note.isBold"
        [class.underline]="note.isUnderline"
        (mousedown)="$event.stopPropagation()"
        (touchstart)="$event.stopPropagation()"
        (input)="onNoteInput(note, $any($event.target).value)"
      ></textarea>
    </div>

  </div>

  <!-- 3-dot menus rendered with position:fixed to escape overflow:hidden -->
  <ng-container *ngIf="!loading">
    <div
      *ngFor="let note of notes; trackBy: trackNote"
      class="note-menu"
      [class.note-menu--open]="openMenuNoteId === note.id"
      [style.top.px]="getMenuPosition(note).top"
      [style.left.px]="getMenuPosition(note).left"
    >
      <!-- Header color picker -->
      <div class="menu-section">
        <div class="menu-label">Header color</div>
        <div class="color-picker-row">
          <div class="color-preview" [style.background]="note.headerColor"></div>
          <input
            type="color"
            class="color-picker-input"
            [value]="note.headerColor"
            (input)="setHeaderColor(note, $any($event.target).value, $event)"
            title="Pick header color"
          />
        </div>
      </div>

      <!-- Body color picker -->
      <div class="menu-section">
        <div class="menu-label">Body color</div>
        <div class="color-picker-row">
          <div class="color-preview" [style.background]="note.noteColor"></div>
          <input
            type="color"
            class="color-picker-input"
            [value]="note.noteColor"
            (input)="setNoteColor(note, $any($event.target).value, $event)"
            title="Pick body color"
          />
        </div>
      </div>

      <!-- Text direction -->
      <div class="menu-section">
        <div class="menu-label">Direction</div>
        <div class="btn-group">
          <button
            class="dir-btn"
            [class.dir-btn--active]="note.textDirection === 'ltr'"
            (click)="setTextDirection(note, 'ltr', $event)"
          >LTR</button>
          <button
            class="dir-btn"
            [class.dir-btn--active]="note.textDirection === 'rtl'"
            (click)="setTextDirection(note, 'rtl', $event)"
          >RTL</button>
          <button
            class="dir-btn"
            [class.dir-btn--active]="note.textDirection === 'auto'"
            (click)="setTextDirection(note, 'auto', $event)"
          >Auto</button>
        </div>
      </div>

      <!-- Text formatting -->
      <div class="menu-section">
        <div class="menu-label">Formatting</div>
        <div class="format-row">
          <!-- Font size -->
          <button class="fmt-btn" (click)="changeFontSize(note, -2, $event)" title="Smaller">A-</button>
          <button class="fmt-btn" (click)="changeFontSize(note, 2, $event)" title="Larger">A+</button>
          <!-- Bold -->
          <button
            class="fmt-btn"
            [class.fmt-btn--active]="note.isBold"
            (click)="toggleBold(note, $event)"
            title="Bold"
          ><b>B</b></button>
          <!-- Underline -->
          <button
            class="fmt-btn"
            [class.fmt-btn--active]="note.isUnderline"
            (click)="toggleUnderline(note, $event)"
            title="Underline"
          ><u>U</u></button>
        </div>
      </div>

      <!-- Text color -->
      <div class="menu-section">
        <div class="menu-label">Text color</div>
        <div class="color-picker-row">
          <div class="color-preview" [style.background]="note.textColor"></div>
          <input
            type="color"
            class="color-picker-input"
            [value]="note.textColor"
            (input)="setTextColor(note, $any($event.target).value, $event)"
            title="Pick text color"
          />
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Floating add button -->
  <button class="fab-add" (click)="addNote()" title="Add note" aria-label="Add note">
    <span class="material-symbols-outlined">add</span>
  </button>

</div>
